<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/emblem.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhumi Vikas Sahayak | MP Building Regulations AI Assistant</title>
    <meta name="description" content="Bhumi Vikas Sahayak (भूमि विकास सहायक) - Verified AI-powered guidance on Madhya Pradesh Bhumi Vikas Niyam, building bylaws, setbacks, FAR, permissions, and municipal norms." />
    <!-- Preconnect and Google Fonts: Outfit and Inter for civic authority & high readability -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Apply the saved or OS colour theme before first paint to avoid a light flash -->
    <script>
      try {
        var savedTheme = localStorage.getItem('bvs_theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
